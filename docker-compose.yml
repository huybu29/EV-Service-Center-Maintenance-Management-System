version: '3.8'

services:
  # ====================================================
  # 1. INFRASTRUCTURE (HẠ TẦNG)
  # ====================================================
  
  # Eureka Server: Trái tim của hệ thống
  eureka-server:
    build: ./backend/eureka-server
    container_name: micro_eureka
    ports:
      - "8761:8761"
    networks:
      - micro_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s 

  # MySQL: Chứa dữ liệu
  mysql:
    image: mysql:8.0
    container_name: micro_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - micro_net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ: Hàng đợi tin nhắn
  rabbitmq:
    image: rabbitmq:3-management
    container_name: micro_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - micro_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis: Cache
  redis:
    image: redis:alpine
    container_name: micro_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - micro_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache NiFi
  nifi:
    image: apache/nifi:latest
    container_name: micro_nifi
    environment:
      - NIFI_WEB_HTTP_PORT=8080
    ports:
      - "8443:8443"
    networks:
      - micro_net

# BẮT BUỘC PHẢI CÓ PHẦN NÀY ĐỂ DOCKER TẠO MẠNG VÀ Ổ ĐĨA
volumes:
  mysql_data:
  nifi_data:

networks:
  micro_net:
    driver: bridge