version: '3.8'

services:

  eureka-server:
    build: ./backend/eureka-server
    container_name: micro_eureka
    ports:
      - "8761:8761"
    networks:
      - micro_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s 


  mysql:
    image: mysql:8.0
    container_name: micro_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - micro_net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: micro_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - micro_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:alpine
    container_name: micro_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - micro_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



  postgres-sonar:
    image: postgres:15
    container_name: micro_postgres_sonar
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonarpassword
      POSTGRES_DB: sonarqube_db
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    networks:
      - micro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  sonarqube:
    image: sonarqube:lts-community
    container_name: micro_sonarqube
    restart: always
    depends_on:
      postgres-sonar:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonarqube_db
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonarpassword
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - micro_net


volumes:
  mysql_data:
  nifi_data:

  postgres_sonar_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  micro_net:
    driver: bridge